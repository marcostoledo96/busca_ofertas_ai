name: Defecto
description: Reportar un comportamiento reproducible
title: "[BUG][P?] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos mínimos de reproducción
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Logs sanitizados, fixture, run ID o captura sin secretos.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Test de regresión esperado
    validations:
      required: true
  - type: dropdown
    id: route-hint
    attributes:
      label: Orientación inicial de routing
      description: Gentle AI confirmará la ruta al iniciar.
      options:
        - Directo inline probable
        - Directo delegado probable
        - Candidato a SDD por causa desconocida o transversal
        - A determinar
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Skills locales probables
      description: Por ejemplo `boai-domain-modeling` o `boai-codebase-design`.
  - type: checkboxes
    id: safety
    attributes:
      label: Seguridad y workflow
      options:
        - label: Verifiqué que la evidencia no contiene cookies, tokens ni datos personales innecesarios.
          required: true
        - label: El fix se mantendrá dentro de esta unidad y agregará test de regresión.
          required: true
