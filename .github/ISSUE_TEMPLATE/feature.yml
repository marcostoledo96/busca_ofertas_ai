name: Implementación o mejora
description: Proponer una unidad de trabajo contractual
title: "[E?][P?][BOAI-???] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Completá criterios verificables y citá la documentación normativa aplicable. La issue es una unidad de trabajo; Gentle AI decidirá la ruta al comenzar.
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Resultado observable que debe alcanzar esta issue.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto y problema
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance
      description: Cambios incluidos.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Fuera de alcance
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Fuentes de autoridad
      description: Documentos, ADR, CONTEXT.md y contratos aplicables.
    validations:
      required: true
  - type: dropdown
    id: route-hint
    attributes:
      label: Orientación inicial de routing
      description: No es vinculante; Gentle AI reevalúa la acción real.
      options:
        - Directo inline probable
        - Directo delegado probable
        - Candidato a SDD con aceptación explícita
        - A determinar al iniciar
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Skills locales probables
      description: Paths `boai-*` relevantes; no reemplazan la autoridad contractual.
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Lista verificable, incluyendo tests y artifacts cuando apliquen.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias y bloqueos
  - type: textarea
    id: provenance
    attributes:
      label: Procedencia prevista
      description: Upstream, SHA, licencia y archivos si se reutiliza código, datos o skills.
  - type: textarea
    id: risks
    attributes:
      label: Riesgos
  - type: checkboxes
    id: workflow
    attributes:
      label: Workflow
      options:
        - label: La issue puede trabajarse de forma aislada sin avanzar el backlog siguiente.
          required: true
        - label: El alcance no presupone SDD; su uso requerirá propuesta y aceptación.
          required: true
